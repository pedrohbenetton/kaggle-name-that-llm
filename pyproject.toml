[project]
name = "kaggle-name-that-llm"
version = "0.1.0"
description = "Atribuição de autoria entre 18 LLMs (Kaggle: Name That LLM)"
requires-python = ">=3.10"
dependencies = ["pandas>=2", "numpy>=1.26", "scikit-learn>=1.4", "pyarrow>=15"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ntl"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["notebooks"]  # gerados por scripts/build_kaggle_notebook.py
line-length = 100

[project.optional-dependencies]
# só para testar localmente o código de GPU com um modelo minúsculo; no Kaggle já vem instalado
nn = ["torch>=2.4", "transformers>=4.51", "peft>=0.13", "tokenizers>=0.20"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
